name: Sync content & deploy

on:
  schedule:
    # Runs every 2 hours. New YouTube episodes will appear on the live
    # site within this window, with zero manual work.
    - cron: "0 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jinja2

      - name: Pull latest episodes from YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/fetch_episodes.py

      - name: Pull latest events from Eventbrite
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          EVENTBRITE_ORG_ID: ${{ secrets.EVENTBRITE_ORG_ID }}
        run: python3 scripts/fetch_events.py

      - name: Build site
        run: python3 build.py

      - name: Commit refreshed content data (if changed)
        run: |
          git config user.name "udi-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/episodes.json data/events.json
          git diff --cached --quiet || git commit -m "Auto-sync: refresh episodes.json / events.json"
          git push || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
